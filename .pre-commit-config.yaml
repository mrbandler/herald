# Hooks run by prek (https://prek.j178.dev) locally and in CI.
# All hooks are native: no Python or Node needed.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
# Tool-generated lockfiles and third-party code (addons) are never touched.
exclude: ^(devenv\.lock|godot/ggg\.lock|godot/addons/.*)$

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: require-pattern
        name: conventional commit message
        stages: [commit-msg]
        args:
          - '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([\w./-]+\))?!?: \S'
          - '^(fixup|squash|amend)! '
          - '^(Merge|Revert) '

  - repo: local
    hooks:
      - id: typos
        name: typos
        entry: typos --force-exclude
        language: system
        types: [text]
      - id: zizmor
        name: zizmor
        entry: zizmor
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
      # Formatters run in fix mode: a changed file fails the hook, you review and `git add` again.
      - id: gdscript-format
        name: gdscript-formatter
        entry: gdscript-formatter
        language: system
        files: \.gd$
      - id: gdscript-lint
        name: gdscript-formatter lint
        entry: gdscript-formatter lint
        language: system
        files: \.gd$
      - id: project-layout
        name: project layout
        entry: python3 tools/check_layout.py
        language: system
        pass_filenames: false
        always_run: true
      - id: just-test
        name: just test
        entry: just test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
