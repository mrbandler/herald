[project]
godot = "4.7.2-stable"

[sync]
force_overwrite = ["**/*.import", "**/*.uid"]

[[dependency]]
name = "gdunit4"
git = "https://github.com/godot-gdunit-labs/gdUnit4.git"
rev = "v6.2.2"
exclude = ["addons/gdUnit4/test"]

[[dependency.map]]
from = "addons/gdUnit4"

[[dependency]]
name = "limbo-console"
url = "https://github.com/limbonaut/limbo_console/releases/download/v0.8.0/limbo_console_v0.8.0.zip"
sha256 = "68cee989910322561222fde3261871a7bd0878122147a949bbb7a27fabef8d9a"

[[dependency]]
name = "guide"
git = "https://github.com/godotneers/G.U.I.D.E.git"
rev = "v0.15.0"

[[dependency.map]]
from = "addons/guide"

[[dependency]]
name = "better-tooltips"
git = "https://github.com/Tobias004/filesystem_dock_tooltips.git"
rev = "10de44d45107a8348190a534bc22f8e69356b4b4"

[[dependency.map]]
from = "addons/better_tooltips"

[[dependency]]
name = "markdownlabel"
git = "https://github.com/daenvil/MarkdownLabel.git"
rev = "v1.4.0"

[[dependency.map]]
from = "addons/markdownlabel"
