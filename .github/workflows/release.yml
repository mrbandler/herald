name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GGG_VERSION: v0.5.0

jobs:
  release:
    name: ${{ matrix.preset }}
    if: ${{ !github.event.repository.is_template }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, preset: Linux, push: build/Linux, channel: linux, butler: linux-amd64 }
          - { os: windows-latest, preset: Windows, push: build/Windows, channel: windows, butler: windows-amd64 }
          - { os: macos-latest, preset: macOS, push: build/macOS/game.zip, channel: macos, butler: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      ITCH_TARGET: ${{ vars.ITCH_USER }}/${{ vars.ITCH_GAME }}
      ITCH_CHANNEL: ${{ github.ref_type == 'tag' && matrix.channel || format('{0}-dev', matrix.channel) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: just
      - name: Install ggg
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -c "irm https://github.com/godotneers/ggg/releases/download/$GGG_VERSION/ggg-installer.ps1 | iex"
          else
            curl -fsSL "https://github.com/godotneers/ggg/releases/download/$GGG_VERSION/ggg-installer.sh" | sh
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # ggg queries the GitHub API without a token, so a cache hit avoids its rate limit and the template download.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ggg
          key: ggg-${{ matrix.os }}-${{ hashFiles('godot/ggg.toml', 'godot/ggg.lock') }}
          restore-keys: ggg-${{ matrix.os }}-
      - name: Godot, export templates and addons
        run: ggg sync --with-export-templates
        working-directory: godot
        env:
          GGG_CACHE_DIR: ${{ runner.temp }}/ggg
      - name: Read version
        id: version
        run: |
          echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      # Godot rewrites project.godot and drops release-please's annotation comments, so stamp the version here.
      - name: Stamp version from version.txt
        run: sed -i.bak "s/^config\/version=.*/config\/version=\"$VERSION\"/" godot/project.godot && rm godot/project.godot.bak
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - name: Export
        run: just export "$PRESET"
        env:
          PRESET: ${{ matrix.preset }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.preset }}
          path: build/${{ matrix.preset }}
      - name: Install butler
        if: ${{ vars.ITCH_USER != '' && vars.ITCH_GAME != '' }}
        env:
          BUTLER_OS: ${{ matrix.butler }}
        run: |
          curl -fsSL -o butler.zip "https://broth.itch.zone/butler/$BUTLER_OS/LATEST/archive/default"
          unzip -q butler.zip -d butler && chmod +x butler/butler* || true
      # The status result lists the channel only if it exists.
      - name: Check itch.io dev channel
        id: channel
        if: ${{ vars.ITCH_USER != '' && vars.ITCH_GAME != '' && github.ref_type != 'tag' }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if ./butler/butler --json status "$ITCH_TARGET:$ITCH_CHANNEL" \
            | jq -e 'select(.type == "result") | .value.channels | length > 0' > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Push to itch.io
        if: ${{ vars.ITCH_USER != '' && vars.ITCH_GAME != '' }}
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          PUSH: ${{ matrix.push }}
          # itch enforces semver (a.b.c-suffix); dev builds carry the short SHA as the suffix.
          USERVERSION: ${{ github.ref_type == 'tag' && steps.version.outputs.version || format('{0}-dev-{1}', steps.version.outputs.version, steps.version.outputs.sha) }}
          # butler only accepts --hidden when the push creates the channel, so new dev channels start hidden.
          HIDDEN: ${{ github.ref_type != 'tag' && steps.channel.outputs.exists != 'true' && '--hidden' || '' }}
        run: ./butler/butler push "$PUSH" "$ITCH_TARGET:$ITCH_CHANNEL" --userversion "$USERVERSION" $HIDDEN
